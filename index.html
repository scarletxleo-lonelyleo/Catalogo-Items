<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a0f"><title>Catálogo de IDs</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar"><div><h1>Catálogo de IDs</h1><p>Imágenes y sus respectivos IDs</p></div><button id="adminBtn" class="ghost">Administrar</button></header>
<main class="container"><section class="toolbar"><input id="search" type="search" placeholder="🔎 Buscar por ID o nombre..."><select id="categoryFilter"><option value="">Todas las categorías</option></select></section><p id="status" class="status">Conectando…</p><section id="catalog" class="grid"></section><p id="empty" class="empty hidden">No se encontraron elementos.</p></main>
<dialog id="loginDialog"><form id="loginForm" class="dialog"><button type="button" class="close" data-close="loginDialog">×</button><h2>Panel privado</h2><p>Inicia sesión con tu cuenta de administrador.</p><label for="email">Correo</label><input id="email" type="email" autocomplete="username" required><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required><button class="primary" type="submit">Iniciar sesión</button><p id="loginError" class="error"></p></form></dialog>
<dialog id="adminDialog"><div class="dialog admin"><div class="dialogHead"><div><h2>Administrar catálogo</h2><p>Los elementos se guardan online.</p></div><button type="button" class="close" data-close="adminDialog">×</button></div>
<form id="itemForm"><label for="itemId">ID / número *</label><input id="itemId" maxlength="120" required><label for="itemName">Nombre (opcional)</label><input id="itemName" maxlength="100"><label for="itemCategory">Categoría (opcional)</label><input id="itemCategory" maxlength="50"><label for="itemImage">Imagen *</label><input id="itemImage" type="file" accept="image/*"><div class="previewWrap"><img id="preview" alt="Vista previa"></div><div class="actions"><button class="primary" id="saveItem" type="submit">Publicar elemento</button><button class="ghost" id="cancelEdit" type="button">Cancelar edición</button></div><p id="formError" class="error"></p></form>
<hr><h3>Elementos publicados</h3><div id="adminList"></div><button id="logout" class="danger">Cerrar sesión</button></div></dialog><div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="script.js"></script></body></html>

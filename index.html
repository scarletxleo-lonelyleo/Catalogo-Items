<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de IDs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Catálogo de IDs</h1>
      <p>Imágenes y sus respectivos IDs</p>
    </div>
    <button id="adminBtn" class="ghost">Administrar</button>
  </header>

  <main class="container">
    <section class="toolbar">
      <input id="search" type="search" placeholder="🔎 Buscar por ID o nombre...">
      <select id="categoryFilter">
        <option value="">Todas las categorías</option>
      </select>
    </section>

    <section id="catalog" class="grid"></section>
    <p id="empty" class="empty hidden">No se encontraron elementos.</p>
  </main>

  <dialog id="loginDialog">
    <form method="dialog" id="loginForm" class="dialog">
      <button type="button" class="close" data-close="loginDialog">×</button>
      <h2>Panel de administración</h2>
      <p>Introduce tu contraseña para administrar el catálogo.</p>
      <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" required>
      <button class="primary" type="submit">Entrar</button>
      <p id="loginError" class="error"></p>
    </form>
  </dialog>

  <dialog id="adminDialog">
    <div class="dialog admin">
      <div class="dialogHead">
        <div>
          <h2>Administrar catálogo</h2>
          <p>Agrega, edita o elimina elementos.</p>
        </div>
        <button type="button" class="close" data-close="adminDialog">×</button>
      </div>

      <form id="itemForm">
        <input id="itemId" type="text" placeholder="ID / número" required maxlength="120">
        <input id="itemName" type="text" placeholder="Nombre (opcional)" maxlength="100">
        <input id="itemCategory" type="text" placeholder="Categoría (opcional)" maxlength="50">
        <input id="itemImage" type="url" placeholder="URL de la imagen" required>
        <div class="previewWrap">
          <img id="preview" alt="Vista previa">
        </div>
        <div class="actions">
          <button class="primary" type="submit">Guardar elemento</button>
          <button class="ghost" type="button" id="cancelEdit">Cancelar</button>
        </div>
      </form>

      <hr>
      <div id="adminList"></div>
      <button id="logout" class="danger">Cerrar sesión</button>
    </div>
  </dialog>

  <div id="toast" class="toast"></div>
  <script src="script.js"></script>
</body>
</html>
